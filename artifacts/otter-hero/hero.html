<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>otter · AgentFramework</title>
<style>
  :root {
    --navy: #14233f;
    --ink: #3a4a63;
    --blue: #8fc3f5;
    --mint: #7fd6a4;
    --teal: #2f8a7e;
    --coral: #f2876b;
    --paper: #fbfaf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1659px; height: 948px; background: var(--paper); }
  body {
    position: relative; overflow: hidden;
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--navy);
  }
  .art {
    position: absolute; inset: 0;
    background: url("hero-art.png") center / cover no-repeat;
  }
  /* Soft fade so the copy sits on clean paper, never on the illustration. */
  .art::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--paper) 0%, rgba(251,250,246,.92) 30%, rgba(251,250,246,0) 46%);
  }
  .copy {
    position: absolute; left: 96px; top: 50%; transform: translateY(-52%);
    width: 640px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 12px; border: 2.5px solid var(--navy); border-radius: 999px;
    background: #fff; font: 600 19px/1 "SF Mono", Menlo, monospace; letter-spacing: .02em;
  }
  .eyebrow i { width: 12px; height: 12px; border-radius: 3px; background: var(--mint); border: 2px solid var(--navy); }
  h1 {
    margin-top: 30px;
    font-size: 104px; font-weight: 800; line-height: .95; letter-spacing: -.035em;
  }
  h1 span { color: var(--teal); }
  .tagline {
    margin-top: 26px;
    font-size: 44px; font-weight: 800; line-height: 1.2; letter-spacing: -.03em;
  }
  .tagline mark {
    background: linear-gradient(transparent 58%, rgba(127,214,164,.55) 58%);
    color: inherit; padding: 0 4px;
  }
  .sub {
    margin-top: 20px; color: var(--ink);
    font-size: 23px; font-weight: 500; line-height: 1.55; letter-spacing: -.01em;
  }
  .pillars { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .pillars li {
    list-style: none; display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 16px; border-radius: 14px; border: 2.5px solid var(--navy); background: #fff;
    font-size: 19px; font-weight: 700; letter-spacing: -.01em;
    box-shadow: 0 4px 0 var(--navy);
  }
  .dot { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--navy); }
  .install {
    margin-top: 34px; display: inline-flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-radius: 14px; background: var(--navy); color: #e8f1ff;
    font: 500 19px/1 "SF Mono", Menlo, monospace;
  }
  .install b { color: var(--mint); font-weight: 700; }
</style>
</head>
<body>
  <div class="art"></div>
  <section class="copy">
    <div class="eyebrow"><i></i>AgentFramework</div>
    <h1>otter<span>.</span></h1>
    <p class="tagline"><mark>실행할수록 쌓이는</mark><br>코딩 에이전트</p>
    <p class="sub">대화는 사라져도 실행 이력은 남아<br>다음 작업의 지식이 됩니다.</p>
    <ul class="pillars">
      <li><span class="dot" style="background:var(--mint)"></span>이력 → 지식 위키</li>
      <li><span class="dot" style="background:var(--blue)"></span>엔진 무관 · 멀티 모델 콤보</li>
      <li><span class="dot" style="background:var(--coral)"></span>자동 스킬 · 의도 라우팅</li>
    </ul>
    <div class="install"><b>$</b> curl -fsSL …/install.sh | bash &nbsp;&amp;&amp;&nbsp; otter</div>
  </section>
</body>
</html>
